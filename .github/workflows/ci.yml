# .github/workflows/ci.yml

name: Continuous Integration

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build
      - name: Check tool versions
        if: always()
        run: |
          echo "Node: $(node -v)"
          echo "pnpm: $(pnpm -v)"
          pnpm exec tsc --version
          pnpm exec eslint --version
          # Show installed @typescript-eslint packages if present, but do not fail if absent
          pnpm list --depth=0 | grep -E '@typescript-eslint' || true

      - name: Run linter
        run: pnpm run lint

      - name: Run tests
        run: pnpm test
      - name: Run tests:e2e with database access
        run: pnpm test:e2e

        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          LIQPAY_PUBLIC_KEY: ${{ secrets.LIQPAY_PUBLIC_KEY }}
          LIQPAY_PRIVATE_KEY: ${{ secrets.LIQPAY_PRIVATE_KEY }}
          API_COUNTRY_STATE_CITY_KEY: ${{ secrets.API_COUNTRY_STATE_CITY_KEY }}
          API_COUNTRY_STATE_CITY_URL: ${{ secrets.API_COUNTRY_STATE_CITY_URL }}
          AUDIENCE: ${{ secrets.AUDIENCE }}
          ISSUER: ${{ secrets.ISSUER }}
