services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-crm-back-dev
    ports:
      - '3000:3000'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env.development
    environment:
      NODE_ENV: development
    command: sh -c "pnpm install && pnpm run start:dev"
